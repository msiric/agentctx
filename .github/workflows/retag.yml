name: retag

# One-off: move each release tag to the rewritten commit with the same tree
# and subject, as an annotated tag by msiric. Removed after use.
on: workflow_dispatch

permissions:
  contents: write

jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: |
          git fetch -q --force origin 'refs/tags/*:refs/tags/*'
          git config user.name "msiric"
          git config user.email "mario.siric@mail.com"
          for t in $(git tag -l 'v*'); do
            old=$(git rev-parse "$t^{}")
            want="$(git rev-parse "$old^{tree}") $(git log -1 --format=%s "$old")"
            new=$(git log --format='%H %T %s' origin/main | while read -r h tr s; do [ "$tr $s" = "$want" ] && { echo "$h"; break; }; done)
            [ -n "$new" ] || { echo "no match for $t"; exit 1; }
            [ "$new" = "$old" ] && { echo "$t already on $new"; continue; }
            msg=$(git tag -l --format='%(contents)' "$t")
            GIT_COMMITTER_DATE=$(git tag -l --format='%(taggerdate:iso-strict)' "$t") git tag -f -a "$t" -m "$msg" "$new"
            echo "$t: $old -> $new"
          done
          git push --force origin --tags
