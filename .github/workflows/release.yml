name: release

# Runs when a version tag is pushed (sh scripts/release X.Y.Z does that).
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write   # create the GitHub release
  id-token: write   # npm trusted publishing (no token needed once configured)

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Use a current npm (trusted publishing needs a recent one)
        run: npm install -g npm@latest

      - name: Tag matches every version field
        run: sh scripts/check-version "${GITHUB_REF_NAME#v}"

      - name: Tests
        run: sh tests/run.sh

      - name: Publish to npm
        env:
          # Only needed until trusted publishing is set up on npmjs.com;
          # leave the secret unset afterwards and npm uses OIDC instead.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          if npm view "agentctx@$v" version >/dev/null 2>&1; then
            echo "agentctx@$v is already on npm; skipping publish"
          else
            npm publish
          fi

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
